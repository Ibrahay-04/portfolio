                  <textarea id="form-message-input" rows="4" required class="w-full px-4 py-3 rounded-xl bg-slate-900/90 border border-slate-700/80 focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 text-white placeholder-slate-500 text-base sm:text-sm outline-none transition-all resize-y"></textarea>
                </div>

                <button type="submit" id="form-submit-btn" class="btn-glow-cyan w-full min-h-[44px] py-3.5 px-6 rounded-xl font-bold text-white bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 shadow-lg shadow-cyan-500/25 transition-all text-sm sm:text-base flex items-center justify-center gap-2">
                  <!-- populated by JS -->
                </button>
              </form>
            </div>
          </div>

        </div>

      </div>
    </section>

  </main>

  <!-- ========================================================================
       FOOTER
       ======================================================================== -->
  <footer class="border-t border-slate-800/80 py-8 sm:py-10 bg-slate-950/60 relative z-10">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <span class="w-2.5 h-2.5 rounded-full bg-cyan-400 shrink-0"></span>
        <p id="footer-copyright-text" class="text-xs sm:text-sm text-slate-400 text-center sm:text-start">
          <!-- populated by JS -->
        </p>
      </div>
      <a href="#" id="back-to-top-btn" class="w-11 h-11 min-w-[44px] min-h-[44px] rounded-xl bg-slate-800 text-slate-300 hover:text-white hover:bg-slate-700 transition-colors shrink-0 flex items-center justify-center" aria-label="Back to Top">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18"/></svg>
      </a>
    </div>
  </footer>

  <!-- ========================================================================
       MODAL READER FOR BLOG ARTICLES
       ======================================================================== -->
  <div id="blog-modal" class="modal-overlay hidden fixed inset-0 z-50 flex items-center justify-center p-2 sm:p-4 md:p-6" aria-modal="true" role="dialog">
    <div id="blog-modal-content" class="modal-content glass-card w-full max-w-3xl max-h-[92dvh] sm:max-h-[88vh] rounded-2xl sm:rounded-3xl border border-slate-700/80 shadow-2xl relative flex flex-col overflow-hidden">
      <!-- Injected by app.js when clicking an article -->
    </div>
  </div>

  <!-- ========================================================================
       FLOATING TOAST CONTAINER
       ======================================================================== -->
  <div id="toast-container"></div>

  <!-- Scripts -->
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
